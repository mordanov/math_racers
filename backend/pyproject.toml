[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-racers-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.13.0",
    "bcrypt>=4.2.0",
    "typing-inspection>=0.4.0,<0.4.3",
    "openai>=1.35.0",
    "Pillow>=10.3.0",
    "boto3>=1.34.0",
    "aiobotocore>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "sqlalchemy[mypy]>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "infrastructure"]

[tool.ruff]
line-length = 100
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = [
    "E501",
    "B008",   # Depends() in function defaults is standard FastAPI pattern
    "A004",   # PermissionError shadow is intentional domain design
    "A001",   # same as A004 at variable level
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = false
exclude = ["alembic/"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no external services)",
    "integration: integration tests (requires Docker Compose stack)",
]
testpaths = ["tests"]
